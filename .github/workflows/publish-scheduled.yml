name: Publish Scheduled Posts

# Requiere secrets en GitHub → Settings → Secrets and variables → Actions:
#   APP_URL   = https://www.consultorio.site
#   CRON_SECRET = (valor del .env CRON_SECRET)

on:
  schedule:
    - cron: '0 * * * *'  # cada hora en punto (UTC)
  workflow_dispatch:       # permite ejecución manual desde GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish endpoint
        run: |
          RESPONSE=$(curl -s -L -w "\n%{http_code}" \
            --max-time 30 --connect-timeout 10 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/publish-scheduled")
          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "Response status: $STATUS"
          echo "Response body: $HTTP_BODY"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: endpoint returned $STATUS"
            exit 1
          fi
